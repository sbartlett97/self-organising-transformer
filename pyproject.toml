[project]
name = "self-organising-transformer"
version = "0.1.0"
description = "A Transformer that learns its own structure during training: differentiable gates (Phase 1) and discrete birth/death of layers, heads and FFN groups (Phase 2)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Bartlett" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.49.0,<5.0",
    "datasets>=3.0.0",
    "tokenizers>=0.20.0",
    "huggingface_hub>=0.34.0,<1.0",
    "accelerate>=1.3.0",
    "numpy>=1.26",
    "safetensors>=0.4.5",
    "lm-eval[hf]>=0.4.12",
    "tqdm>=4.66",
    "typing_extensions>=4.13",
    # trackio>=0.21.0 requires huggingface-hub>=1.10.0, incompatible with
    # transformers<5.0's own huggingface-hub<1.0 requirement -- 0.20.0 is
    # the last trackio release without that floor. gradio is pinned to the
    # range whose own huggingface-hub floor (<2.0,>=0.33.5) actually fits
    # too, since trackio's own gradio constraint is loose enough to drift.
    "trackio==0.20.0",
    "gradio>=6.10.0,<6.20.0",
]

[project.urls]
Repository = "https://github.com/sbartlett97/self-organising-transformer"
"Hugging Face models" = "https://huggingface.co/sbartlett97"

[project.optional-dependencies]
dev = ["matplotlib>=3.8"]
